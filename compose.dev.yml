services:
  catalog-db:
    image: ${POSTGRES_IMAGE:-postgres:18.4-bookworm}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: catalog_dev
      POSTGRES_USER: catalog_app
      POSTGRES_PASSWORD_FILE: /run/secrets/catalog_db_password
    secrets:
      - catalog_db_password
    ports:
      - "127.0.0.1:${CATALOG_DB_PORT:-54321}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql
      - ./db/init-catalog.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_app -d catalog_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  guide-db:
    image: ${POSTGRES_IMAGE:-postgres:18.4-bookworm}
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - ./guide-service/.env
    environment:
      POSTGRES_DB: guide_dev
      POSTGRES_USER: guide_app
      POSTGRES_PASSWORD_FILE: /run/secrets/guide_db_password
    secrets:
      - guide_db_password
    ports:
      - "127.0.0.1:${GUIDE_DB_PORT:-54322}:5432"
    volumes:
      - guide-db-data:/var/lib/postgresql
      - ./db/init-guide.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guide_app -d guide_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  quotes-db:
    image: ${POSTGRES_IMAGE:-postgres:18.4-bookworm}
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - ./quote-service/.env
    environment:
      POSTGRES_DB: quotes_dev
      POSTGRES_USER: quotes_app
      POSTGRES_PASSWORD_FILE: /run/secrets/quotes_db_password
    secrets:
      - quotes_db_password
    ports:
      - "127.0.0.1:${QUOTES_DB_PORT:-54323}:5432"
    volumes:
      - quotes-db-data:/var/lib/postgresql
      - ./db/init-quotes.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotes_app -d quotes_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

secrets:
  catalog_db_password:
    file: ./catalog-service/.secrets/catalog-db-password.txt
  guide_db_password:
    file: ./guide-service/.secrets/guide-db-password.txt
  quotes_db_password:
    file: ./quote-service/.secrets/quotes-db-password.txt

volumes:
  catalog-db-data:
  guide-db-data:
  quotes-db-data:
